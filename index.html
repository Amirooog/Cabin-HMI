<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cabin HMI">
<meta name="theme-color" content="#050607">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>html,body{position:fixed;inset:0;width:100%;height:100%;margin:0}</style>
<title>Cabin Touch HMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Vazirmatn:wght@400;500;700&display=swap">
<style>
/* Deliberately single-theme: an automotive display at night. Every colour painted explicitly. */
:root{
  --bezel:#050607; --screen:#0B0F13; --s1:#131920; --s2:#1A222A; --s3:#232E38; --line:#2A3641;
  --tx:#E4ECF1; --tx2:#93A2AE; --tx3:#5D6B77;
  --acc:#5CC3E6; --acc-bg:#15384A; --warm:#F08A4E; --cold:#5A9EF0; --ok:#5BD08A; --bad:#F0605A; --amber:#F2B84B;
  --fe:"Barlow","Vazirmatn",system-ui,sans-serif; --ff:"Vazirmatn","Barlow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bezel);color:var(--tx);margin:0;padding-inline:16px;padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px));box-sizing:border-box;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[role=button]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-rows:46px minmax(0,1fr) 96px;background:var(--screen);border-radius:20px;overflow:hidden;position:relative;font-family:var(--fe);font-size:17px}
#app[dir=rtl]{font-family:var(--ff)}
#dim{position:absolute;inset:0;background:#000;pointer-events:none;z-index:50}

/* status */
.status{display:flex;align-items:center;justify-content:space-between;padding-inline:22px;color:var(--tx2);font-size:16px;gap:16px}
#clock{font-weight:600;color:var(--tx);font-size:18px;min-width:70px;display:flex;align-items:center;gap:8px}
#clock .rec{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.st-r{display:flex;align-items:center;gap:16px}
.st-r svg.i{width:20px;height:20px}
.callpill{display:flex;align-items:center;gap:8px;background:#173d2a;color:var(--ok);padding:6px 14px;border-radius:99px;font-weight:600}
.callpill svg.i{width:18px;height:18px}
.navpill{display:flex;align-items:center;gap:8px;color:var(--acc);font-weight:600}

/* bottom bar — physical left = driver, never mirrored */
.bar{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding-inline:14px;background:var(--s1);border-top:1px solid var(--line)}
.bar .dock{display:flex;justify-content:center;gap:4px;min-width:0}
.tctl{display:flex;align-items:center;gap:2px}
.tctl button{width:58px;height:72px;border-radius:14px;display:grid;place-items:center;color:var(--tx2)}
.tctl button:active{background:var(--s3)}
.tctl .tv{width:auto;min-width:86px;font-size:30px;font-weight:600;color:var(--tx);padding-inline:6px}
.dock button{width:84px;height:76px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--tx2);font-size:13px;position:relative}
.dock button.on{color:var(--acc);background:var(--acc-bg)}
.dock button:active{background:var(--s3)}
.dock .badge{position:absolute;top:8px;inset-inline-end:16px;font-size:12px;font-weight:700;color:var(--tx)}
.volctl{display:flex;align-items:center;gap:2px;padding-inline:8px;border-inline:1px solid var(--line)}
.volctl button{width:56px;height:72px;border-radius:14px;display:grid;place-items:center;color:var(--tx2)}
.volctl button:active{background:var(--s3)}
.volctl .vn{font-size:15px;font-weight:600;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:2px}

#main{position:relative;min-height:0;overflow:hidden}
.scr{position:absolute;inset:0;padding:18px 22px;display:flex;flex-direction:column;gap:14px;min-height:0}

.card{background:var(--s1);border-radius:18px;border:1px solid var(--line);position:relative;overflow:hidden}
[role=button]{cursor:pointer}
.h{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);font-weight:600}
#app[dir=rtl] .h{letter-spacing:0;text-transform:none;font-size:15px}
.btn{min-height:64px;padding-inline:20px;border-radius:14px;background:var(--s2);display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:17px;color:var(--tx)}
.btn:active,.tile:active,.row:active,.key:active{background:var(--s3)}
.btn.pri{background:var(--acc);color:#04202B}
.btn.pri:active{background:#8AD6F0}
.btn.dng{background:var(--bad);color:#2A0605}
.tile{background:var(--s2);border-radius:16px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--tx2);font-size:14px;font-weight:600;text-align:center;padding:8px;line-height:1.2}
.tile.on{background:var(--acc-bg);color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.tile.warm.on{background:#3A2113;color:var(--warm);box-shadow:inset 0 0 0 1.5px var(--warm)}
.tile .lv{display:flex;gap:3px}
.tile .lv i{width:14px;height:4px;border-radius:2px;background:var(--s3)}
.tile .lv i.a{background:currentColor}

/* home */
.home{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;flex:1;min-height:0}
.home .col{display:grid;grid-template-rows:auto auto 1fr;gap:14px;min-height:0}
.mapcard{min-height:0}
.mapcard canvas{position:absolute;inset:0;width:100%;height:100%}
.mapover{position:absolute;inset-inline:16px;top:16px;display:flex;gap:10px;align-items:center}
.pill{background:rgba(19,25,32,.92);border:1px solid var(--line);border-radius:99px;padding:14px 20px;display:flex;align-items:center;gap:10px;color:var(--tx2);font-weight:500;backdrop-filter:blur(6px)}
.mcard{padding:16px;display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.art{width:96px;height:96px;border-radius:12px;flex:none}
.mt{font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ma{color:var(--tx2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mctl{display:flex;gap:6px;margin-top:10px}
.mctl button{width:64px;height:56px;border-radius:12px;background:var(--s2);display:grid;place-items:center}
.mctl button:active{background:var(--s3)}
.ccard{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ccard .big{font-size:40px;font-weight:600;line-height:1}
.ccard .meta{display:flex;gap:14px;color:var(--tx2);align-items:center;font-size:15px}
.trip{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.trip b{display:block;font-size:24px;font-weight:600}
.trip span{color:var(--tx3);font-size:13px}

/* climate */
.clim{display:grid;grid-template-columns:minmax(150px,1fr) 2.3fr minmax(150px,1fr);gap:16px;flex:1;min-height:0}
.zone{display:flex;flex-direction:column;gap:10px;min-height:0}
.tbig{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:8px;min-height:0}
.tbig button{width:100%;flex:1;max-height:90px;border-radius:14px;display:grid;place-items:center;color:var(--tx2)}
.tbig button:active{background:var(--s3)}
.tbig button svg.i{width:36px;height:36px}
.tbig .v{font-size:56px;font-weight:600;line-height:1}
.tbig .z{font-size:14px;color:var(--tx3)}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cen{display:flex;flex-direction:column;gap:12px;min-height:0}
.r4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fanrow{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:6px}
.fanrow>button{height:60px;border-radius:12px;display:grid;place-items:center;color:var(--tx2)}
.fanrow>button:active{background:var(--s3)}
.segs{display:flex;gap:5px;align-items:flex-end;height:60px}
.segs button{flex:1;height:100%;position:relative}
.segs button::after{content:"";position:absolute;inset-inline:0;bottom:0;border-radius:6px;background:var(--s3);height:var(--hh)}
.segs button.a::after{background:var(--acc)}
.fanlbl{display:flex;justify-content:space-between;color:var(--tx3);font-size:13px;padding-inline:4px}

/* media */
.med{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;flex:1;min-height:0}
.now{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:0}
.srcbtn{align-self:flex-start;min-height:56px;padding-inline:16px;border-radius:12px;background:var(--s2);display:flex;align-items:center;gap:10px;font-weight:600}
.nowbody{display:flex;gap:22px;align-items:center;flex:1;min-height:0}
.nowbody .art{width:clamp(120px,20vh,190px);height:clamp(120px,20vh,190px);border-radius:16px}
.nowbody .mt{font-size:28px;white-space:normal}
.prog{height:6px;border-radius:3px;background:var(--s3);position:relative;margin-top:14px}
.prog i{position:absolute;inset-block:0;left:0;border-radius:3px;background:var(--tx)}
.times{display:flex;justify-content:space-between;color:var(--tx3);font-size:13px;margin-top:6px}
.bigctl{display:flex;justify-content:center;gap:18px}
.bigctl button{width:84px;height:72px;border-radius:16px;background:var(--s2);display:grid;place-items:center}
.bigctl button.pp{width:104px;background:var(--tx);color:var(--screen)}
.bigctl button:active{background:var(--s3)}
.bigctl svg.i{width:30px;height:30px}
.freq{font-size:72px;font-weight:600;line-height:1}
.list{padding:10px;display:flex;flex-direction:column;min-height:0}
.list .h{padding:8px 10px}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;flex:1;overscroll-behavior:contain}
.row{width:100%;min-height:64px;padding:8px 12px;border-radius:12px;display:flex;align-items:center;gap:14px;text-align:start}
.row.on{background:var(--acc-bg)}
.row .art{width:46px;height:46px;border-radius:8px}
.row .t1{font-weight:600;font-size:17px}
.row .t2{color:var(--tx2);font-size:14px}
.row .gr{flex:1;min-width:0}
.row .gr>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px}
.presets .tile{min-height:84px}
.presets .tile b{font-size:22px;color:var(--tx)}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-start;justify-content:flex-start;padding:70px 22px}
.sheet{width:min(420px,100%);padding:10px;background:var(--s2);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:4px}
.sheet .row.on{background:var(--acc-bg)}

/* phone */
.ph{display:grid;grid-template-columns:120px 1fr;gap:14px;flex:1;min-height:0}
.tabs{display:flex;flex-direction:column;gap:8px}
.tabs .tile{min-height:88px}
.av{width:44px;height:44px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:700;color:var(--tx2);flex:none}
.cdet{display:flex;gap:10px;padding:4px 12px 12px 70px}
#app[dir=rtl] .cdet{padding:4px 70px 12px 12px}
.kp{display:grid;grid-template-columns:1fr 280px;gap:18px;padding:18px;flex:1;min-height:0}
.kpd{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
.kpd .dn{font-size:40px;font-weight:600;min-height:52px;direction:ltr}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:center}
.key{height:64px;border-radius:14px;background:var(--s2);font-size:26px;font-weight:600;display:grid;place-items:center}
.callscr{position:absolute;inset:0;z-index:15;background:linear-gradient(180deg,#0F1A16,var(--screen));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.callscr .av{width:110px;height:110px;font-size:40px}
.callscr .nm{font-size:34px;font-weight:600}
.callscr .stt{color:var(--tx2);font-size:18px}
.cbtns{display:flex;gap:18px;margin-top:18px}
.cbtns .tile{width:100px;min-height:88px}
.cbtns .end{background:var(--bad);color:#2A0605}

/* nav */
.nav{position:absolute;inset:0}
.nav canvas{position:absolute;inset:0;width:100%;height:100%}
.nav .pill{position:absolute;top:18px;inset-inline-start:22px;min-height:64px;min-width:320px;font-size:18px}
.zoom{position:absolute;inset-inline-end:22px;top:18px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:64px;height:64px;border-radius:14px;background:rgba(19,25,32,.92);border:1px solid var(--line);display:grid;place-items:center}
.srch{position:absolute;top:14px;bottom:14px;inset-inline-start:14px;width:min(620px,calc(100% - 28px));background:var(--s1);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;padding:10px;gap:8px;z-index:5}
.qrow{display:flex;gap:8px;align-items:center}
.qbox{flex:1;min-height:56px;background:var(--s2);border-radius:12px;display:flex;align-items:center;gap:10px;padding-inline:14px;font-size:20px}
.qbox .phd{color:var(--tx3)}
.caret{display:inline-block;width:2px;height:24px;background:var(--acc);animation:bl 1s steps(1) infinite;vertical-align:middle}
@keyframes bl{50%{opacity:0}}
.qrow>button{width:56px;height:56px;border-radius:12px;background:var(--s2);display:grid;place-items:center}
.kb{display:flex;flex-direction:column;gap:6px}
.kb .kr{display:flex;gap:5px;justify-content:center}
.kb .key{flex:1;max-width:52px;height:50px;font-size:20px;font-weight:500}
.kb .key.w{max-width:none;flex:3;font-size:15px}
.kb .key.m{max-width:90px;flex:1.6;font-size:15px}
.navcard{position:absolute;inset-inline-start:22px;bottom:18px;width:min(440px,calc(100% - 44px));padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:18px;z-index:5}
.navcard .t1{font-size:24px;font-weight:600}
.navcard .t2{color:var(--tx2)}
.navcard .stats{display:flex;gap:22px}
.navcard .stats b{font-size:26px;font-weight:600;display:block}
.navcard .stats span{color:var(--tx3);font-size:13px}
.navcard .acts{display:flex;gap:10px}
.navcard .acts .btn{flex:1}
.man{position:absolute;top:18px;inset-inline-start:22px;background:#0E5B45;color:#E9FFF5;border-radius:18px;padding:16px 22px;display:flex;align-items:center;gap:16px;z-index:5;max-width:calc(100% - 130px)}
.man svg.i{width:44px;height:44px;stroke-width:2.4}
.man b{font-size:30px;font-weight:700;display:block}

/* settings */
.set{display:flex;flex-direction:column;gap:12px;max-width:760px;width:100%;margin-inline:auto}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px}
.srow .lbl{font-size:18px;font-weight:500}
.seg{display:flex;background:var(--s2);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:56px;padding-inline:22px;border-radius:10px;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--s3);color:var(--tx)}
.bri{display:flex;align-items:center;gap:10px}
.bri button{width:60px;height:60px;border-radius:12px;background:var(--s2);display:grid;place-items:center}
.bri .bar2{width:180px;height:8px;border-radius:4px;background:var(--s3);position:relative}
.bri .bar2 i{position:absolute;inset-block:0;left:0;border-radius:4px;background:var(--acc)}

/* toasts / overlays */
#vtoast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:14px 20px;display:flex;gap:14px;align-items:center;z-index:30;direction:ltr;transition:opacity .2s}
#vtoast .vb{width:260px;height:8px;border-radius:4px;background:var(--s3);position:relative}
#vtoast .vb i{position:absolute;inset-block:0;left:0;border-radius:4px;background:var(--tx)}

.ovl{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.instr{background:rgba(5,6,7,.94)}
.instr .box{max-width:720px;text-align:center;display:flex;flex-direction:column;gap:28px;align-items:center}
.instr .k{font-family:var(--fe);color:var(--tx3);font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.instr .q{font-size:clamp(26px,4vw,40px);line-height:1.6;font-weight:600;text-wrap:balance}
.instr .btn{min-width:240px;min-height:76px;font-size:22px}
.done{pointer-events:none}
.done .ck{width:150px;height:150px;border-radius:50%;background:rgba(91,208,138,.16);display:grid;place-items:center;color:var(--ok);animation:pop .9s ease forwards}
.done .ck svg.i{width:80px;height:80px;stroke-width:2.6}
@keyframes pop{0%{transform:scale(.7);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}

/* researcher panel — deliberately amber, outside the HMI */
#rp{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);display:flex;justify-content:flex-end;font-family:var(--fe);direction:ltr}
.rp{width:min(560px,100%);height:100%;background:#15130E;border-inline-start:2px solid var(--amber);display:flex;flex-direction:column;color:#EDE6D6;font-size:15px}
.rp header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #3A3222}
.rp header b{color:var(--amber);letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.rp .body{overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:18px;flex:1}
.rp h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#A89877}
.rp label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#A89877;flex:1}
.rp input{font:inherit;font-size:16px;background:#221E15;border:1px solid #3A3222;color:#EDE6D6;border-radius:10px;padding:10px 12px;-webkit-user-select:text;user-select:text}
.rp .fr{display:flex;gap:10px;flex-wrap:wrap}
.rb{min-height:44px;padding-inline:14px;border-radius:10px;background:#2A2419;color:#EDE6D6;font-weight:600;font-size:14px}
.rb:active{background:#3A3222}
.rb.a{background:var(--amber);color:#241A04}
.rb.x{background:#4A1F1C;color:#FFD9D6}
.tl{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:#1D1A12;border-radius:10px;padding:8px 10px}
.trow .c{font-weight:700;color:var(--amber)}
.trow .d{font-family:var(--ff);direction:rtl;text-align:right;font-size:14px}
.trow .lv{font-size:11px;color:#A89877}
.live{background:#2A1F0B;border:1px solid var(--amber);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.tbw{overflow-x:auto;border:1px solid #3A3222;border-radius:10px}
.rp table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.rp th,.rp td{padding:7px 9px;text-align:left;border-bottom:1px solid #2A2419;white-space:nowrap}
.rp th{color:#A89877;font-weight:600}
.res-success{color:var(--ok)} .res-timeout,.res-abandoned{color:var(--bad)}
.rp .note{color:#A89877;font-size:13px;line-height:1.5}
.rp textarea{width:100%;height:140px;font:12px ui-monospace,monospace;background:#221E15;color:#EDE6D6;border:1px solid #3A3222;border-radius:10px;-webkit-user-select:text;user-select:text}

@media (max-width:900px){

/* ---------- map ---------- */
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
const PARKS=(()=>{const r=rng(7),a=[];for(let i=0;i<60;i++)a.push([ (r()-.5)*40000,(r()-.5)*40000,300+r()*1400,300+r()*1100]);return a})();
function drawMap(cv){
  const R=cv.getBoundingClientRect(); if(!R.width) return; const dpr=window.devicePixelRatio||1;
  cv.width=R.width*dpr; cv.height=R.height*dpr; const g=cv.getContext('2d'); g.scale(dpr,dpr); const W=R.width,H=R.height;
  const mini=cv.dataset.map==='mini', n=S.nav;
  const tid=n.mode==='route'?n.dest:n.mode==='preview'?n.sel:null, tg=tid?PB[tid]:null;
  let sc=0.06*n.zoom*(mini?.8:1), cx=0, cy=0, offX=0;
  if(tg){const pad=mini?40:140;sc=Math.min((W-pad*2)/Math.max(Math.abs(tg.x),300),(H-pad*2)/Math.max(Math.abs(tg.y),300),.14)*n.zoom;cx=tg.x/2;cy=tg.y/2;
    if(!mini&&n.mode!=='idle'){offX=Math.min(240,W*.18)*(S.lang==='fa'?-1:1)}}
  if(n.mode==='search'&&!mini){offX=Math.min(330,W*.25)*(S.lang==='fa'?-1:1)}
  const P=(x,y)=>[W/2+offX+(x-cx)*sc,H/2+(y-cy)*sc];
  g.fillStyle='#0E1317';g.fillRect(0,0,W,H);
  g.fillStyle='#122019';PARKS.forEach(([x,y,w,h])=>{const[a,b]=P(x,y);g.fillRect(a,b,w*sc,h*sc)});
  let sp=400;while(sp*sc<16)sp*=5;
  const x0=cx-(W/2+Math.abs(offX))/sc, x1=cx+(W/2+Math.abs(offX))/sc, y0=cy-H/2/sc, y1=cy+H/2/sc;
  const grid=(step,col,w)=>{g.strokeStyle=col;g.lineWidth=w;g.beginPath();
    for(let x=Math.floor(x0/step)*step;x<=x1;x+=step){const[a]=P(x,0);g.moveTo(a,0);g.lineTo(a,H)}
    for(let y=Math.floor(y0/step)*step;y<=y1;y+=step){const[,b]=P(0,y);g.moveTo(0,b);g.lineTo(W,b)}g.stroke()};
  grid(sp,'#18222A',1);grid(sp*5,'#223039',3);
  g.strokeStyle='#2E3E4A';g.lineWidth=6;g.lineCap='round';
  [[[-30000,-9000],[30000,7000]],[[-7000,-30000],[-2500,30000]],[[-30000,12000],[30000,2000]]].forEach(([a,b])=>{g.beginPath();g.moveTo(...P(...a));g.lineTo(...P(...b));g.stroke()});
  if(tg){const pts=[[0,0],[tg.x,0],[tg.x,tg.y]].map(p=>P(...p));
    g.lineJoin='round';g.strokeStyle='rgba(92,195,230,.25)';g.lineWidth=14;g.beginPath();g.moveTo(...pts[0]);pts.slice(1).forEach(p=>g.lineTo(...p));g.stroke();
    g.strokeStyle='#5CC3E6';g.lineWidth=6;g.stroke();
    const[dx,dy]=pts[2];g.fillStyle='#F0605A';g.beginPath();g.arc(dx,dy,11,0,7);g.fill();g.fillStyle='#0E1317';g.beginPath();g.arc(dx,dy,4,0,7);g.fill()}
  const[cxp,cyp]=P(0,0);g.save();g.translate(cxp,cyp);
  g.fillStyle='rgba(92,195,230,.18)';g.beginPath();g.arc(0,0,26,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.moveTo(0,-14);g.lineTo(10,11);g.lineTo(0,6);g.lineTo(-10,11);g.closePath();g.fill();g.restore();
}

/* ---------- actions ---------- */
const clampT=v=>Math.max(16,Math.min(28,v));
const ACT={
 go(v){S.screen=v;S.sheet=null},
 temp(v){const s=v[0],d=v[1]==='+'?.5:-.5;const c=S.clim;
   if(s==='d'){c.dT=clampT(c.dT+d);if(c.sync)c.pT=c.dT}else{c.pT=clampT(c.pT+d);c.sync=false}},
 fan(v){const c=S.clim;c.auto=false;if(v==='+')c.fan=Math.min(7,c.fan+1);else if(v==='-')c.fan=Math.max(1,c.fan-1);else c.fan=+v},
 mode(v){S.clim.mode=v;S.clim.auto=false;if(S.clim.fDef&&v!=='wind')S.clim.fDef=false},
 tog(k){const c=S.clim;c[k]=!c[k];
   if(k==='sync'&&c.sync)c.pT=c.dT;
   if(k==='fDef'){if(c.fDef){c.prevMode=c.mode;c.mode='wind';c.ac=true;c.fan=Math.max(c.fan,6);c.auto=false}else c.mode=c.prevMode}},
 seat(k){const c=S.clim;c[k]=[3,0,1,2][c[k]]??0;const side=k.slice(-1);
   if(c[k]){if(k.startsWith('seat'))c['vent'+side]=0;else c['seat'+side]=0}},
 mplay(){S.media.playing=!S.media.playing},
 mnext(){const m=S.media;if(m.src==='fm')return ACT.fmseek('+');if(m.src==='usb'){m.usb=(m.usb+1)%USB.length;m.upos=0}else{m.track=(m.track+1)%TRACKS.length;m.pos=0}m.playing=true},
 mprev(){const m=S.media;if(m.src==='fm')return ACT.fmseek('-');
   if(m.src==='usb'){if(m.upos>3)m.upos=0;else{m.usb=(m.usb+USB.length-1)%USB.length;m.upos=0}}
   else{if(m.pos>3)m.pos=0;else{m.track=(m.track+TRACKS.length-1)%TRACKS.length;m.pos=0}}m.playing=true},
 mtrack(v){const m=S.media;if(m.src==='usb'){m.usb=+v;m.upos=0}else{m.track=+v;m.pos=0}m.playing=true},
 msrc(){S.sheet='src'},closesheet(){S.sheet=null},
 setsrc(v){S.media.src=v;S.media.playing=true;S.sheet=null},
 fmpre(v){S.media.fm=+v;S.media.freq=FMS[v].f;S.media.playing=true},
 fmtune(v){const m=S.media;m.freq=Math.round((Math.max(87.5,Math.min(108,m.freq+(v==='+'?.1:-.1))))*10)/10;const i=FMS.findIndex(s=>Math.abs(s.f-m.freq)<.05);if(i>=0)m.fm=i},
 fmseek(v){const m=S.media;const up=v==='+';const c=up?FMS.find(s=>s.f>m.freq+.05)||FMS[0]:[...FMS].reverse().find(s=>s.f<m.freq-.05)||FMS[FMS.length-1];m.fm=FMS.indexOf(c);m.freq=c.f;m.playing=true},
 vol(v){const m=S.media;if(v==='mute')m.mute=!m.mute;else{m.mute=false;m.vol=Math.max(0,Math.min(30,m.vol+(v==='+'?1:-1)))}volToast()},
 ptab(v){S.phone.tab=v;S.phone.open=null},
 popen(v){S.phone.open=S.phone.open===v?null:v},
 pcall(v){if(S.phone.call)return;let cid=null,num,name;if(v.startsWith('num:')){num=v.slice(4);name=num}else{cid=v;num=CB[v].n;name=nm(CB[v])}
   S.phone.call={cid,num,name,t0:Date.now(),mute:false,spk:false}},
 pkey(v){if(S.phone.dial.length<14)S.phone.dial+=v},pdel(){S.phone.dial=S.phone.dial.slice(0,-1)},
 pdial(){const d=S.phone.dial.replace(/\s/g,'');if(!d)return;const c=CON.find(c=>c.n.replace(/\s/g,'')===d);ACT.pcall(c?c.id:'num:'+S.phone.dial)},
 pmute(){S.phone.call.mute=!S.phone.call.mute},pspk(){S.phone.call.spk=!S.phone.call.spk},
 pend(){const c=S.phone.call;S.phone.rec.unshift({cid:c.cid,n:c.num,k:'outgoing',w:{en:'Now',fa:'همین حالا'}});S.phone.call=null},
 nsearch(){S.nav.mode='search';S.nav.q='';S.nav.kb=S.lang},
 nclose(){S.nav.mode=S.nav.dest?'route':'idle'},
 nkey(v){if(S.nav.q.length<30)S.nav.q+=v},ndel(){S.nav.q=S.nav.q.slice(0,-1)},nkb(){S.nav.kb=S.nav.kb==='fa'?'en':'fa'},
 npick(v){S.nav.sel=v;S.nav.mode='preview';S.nav.zoom=1},
 nstart(){S.nav.dest=S.nav.sel;S.nav.mode='route';S.nav.t0=Date.now()},
 ncancel(){S.nav.sel=null;S.nav.mode=S.nav.dest?'route':'idle'},
 nend(){S.nav.dest=null;S.nav.sel=null;S.nav.mode='idle';S.nav.zoom=1},
 nzoom(v){S.nav.zoom=Math.max(.25,Math.min(4,S.nav.zoom*(v==='+'?1.5:1/1.5)))},
 bright(v){PREF.bright=Math.max(20,Math.min(100,PREF.bright+(v==='+'?10:-10)));savePref()},
 lang(v){S.lang=PREF.lang=v;savePref()},
 click(v){PREF.click=v==='1';savePref()}
};
let vtT;
function volToast(){const m=S.media,el=$('#vtoast');el.innerHTML=`${I(m.mute?'mute':'vol')}<div class="vb"><i style="width:${m.mute?0:m.vol/30*100}%"></i></div><b class="num">${m.mute?'—':N(m.vol)}</b>`;el.style.opacity=1;clearTimeout(vtT);vtT=setTimeout(()=>el.style.opacity=0,1300)}

/* click sound */
let ac=null;
function tick(){if(!PREF.click)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=1900;g.gain.setValueAtTime(.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.03);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.035)}catch(e){}}

$('#app').addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;
  const f=ACT[el.dataset.a];if(!f)return;
  if(el.dataset.a==='closesheet'&&e.target!==el)return;
  tick();f(el.dataset.v,el);render();checkTask()});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

/* 1 s tick */
setInterval(()=>{const m=S.media;
  if(m.playing&&m.src==='bt'){m.pos++;if(m.pos>=TRACKS[m.track].d){m.track=(m.track+1)%TRACKS.length;m.pos=0;if(S.screen==='media'||S.screen==='home')render()}}
  if(m.playing&&m.src==='usb'){m.upos++;if(m.upos>=USB[m.usb].d){m.usb=(m.usb+1)%USB.length;m.upos=0;if(S.screen==='media')render()}}
  const tr=cur(),pos=m.src==='usb'?m.upos:m.pos;const pb=$('#pbar');if(pb){pb.style.width=pos/tr.d*100+'%';$('#ptime').textContent=mmss(pos)}
  if(S.phone.call){['#ctime','#ctime2'].forEach(s=>{const e=$(s);if(e)e.textContent=callStatus()})}
  const ck=$('#clock span');if(ck){const d=new Date();ck.textContent=N(d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'))}
  if(trial&&trial.running&&performance.now()-trial.start>TIMEOUT)finish('timeout');
},1000);
window.addEventListener('resize',()=>document.querySelectorAll('canvas[data-map]').forEach(drawMap));

/* ================= Researcher mode ================= */
const TIMEOUT=120000;
let trial=null, db=null, dl=null, remote=null, local=store.get('trials',[]), msg='';
let pending=null;

// log every touch inside the HMI while a trial runs
document.addEventListener('pointerdown',e=>{
  if(!trial||!trial.running)return; if(!$('#app').contains(e.target)||e.target.closest('[data-nolog]'))return;
  const el=e.target.closest('[data-a]'); const now=performance.now()-trial.start;
  const lbl=el?el.dataset.a+(el.dataset.v!==undefined?':'+el.dataset.v:''):'miss';
  trial.taps++; if(!el)trial.misses++; if(trial.first==null)trial.first=now;
  if(trial.path.length<400)trial.path.push({t:Math.round(now),a:lbl,s:S.screen});
},true);

function startTask(id){
  const tk=TASKS.find(x=>x.id===id); closePanel();
  S=fresh(); render();
  pending={task:tk};
  const q=S.lang==='fa'?tk.fa:tk.en;
  $('#ovl').innerHTML=`<div class="ovl instr" dir="${S.lang==='fa'?'rtl':'ltr'}" style="font-family:${S.lang==='fa'?'var(--ff)':'var(--fe)'}"><div class="box">
   <div class="k">${tk.id} · ${tk.lv}</div><div class="q">${esc(q)}</div>
   <button class="btn pri" id="goBtn">${S.lang==='fa'?'شروع':'Start'}</button></div></div>`;
  $('#goBtn').onclick=()=>{ $('#ovl').innerHTML='';
    trial={task:tk,base:JSON.parse(JSON.stringify(S)),start:performance.now(),startedAt:new Date().toISOString(),taps:0,misses:0,first:null,path:[],running:true};
    pending=null; renderStatus(); };
}
function checkTask(){ if(!trial||!trial.running)return; if(trial.task.ok(S,trial.base))finish('success'); }
async function finish(result){
  if(!trial||!trial.running)return; trial.running=false;
  const dur=Math.round(performance.now()-trial.start);
  const rec={participant:PREF.participant||'—',condition:PREF.condition||'',task:trial.task.id,level:trial.task.lv,taskLabel:trial.task.en,
    result,durationMs:dur,taps:trial.taps,misses:trial.misses,firstTapMs:trial.first==null?null:Math.round(trial.first),
    screens:[...new Set(trial.path.map(p=>p.s))],path:trial.path,lang:S.lang,startedAt:trial.startedAt};
  renderStatus();
  if(result==='success'){ $('#ovl').innerHTML=`<div class="ovl done"><div class="ck">${I('check')}</div></div>`; setTimeout(()=>$('#ovl').innerHTML='',950) }
  local.unshift({id:'L'+Date.now(),...rec}); local=local.slice(0,500); store.set('trials',local);
  msg='';
  if(db){ try{ await db.collection('trials').add(rec); msg='Saved to the shared log.' }catch(e){ msg=e&&e.code==='quota_exceeded'?'Shared log is full — kept on this device only.':'Could not reach the shared log — kept on this device only.' } }
  else msg='Saved on this device (no shared log in this view).';
  setTimeout(()=>openPanel(),result==='success'?1000:200);
}
const rows=()=>remote||local;
function csv(){const H=['participant','condition','task','level','result','duration_s','taps','misses','first_tap_s','screens','path','started_at','lang'];
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return [H.join(','),...[...rows()].reverse().map(r=>[r.participant,r.condition,r.task,r.level,r.result,(r.durationMs/1000).toFixed(2),r.taps,r.misses,r.firstTapMs==null?'':(r.firstTapMs/1000).toFixed(2),(r.screens||[]).join(' > '),(r.path||[]).map(p=>p.a).join(' > '),r.startedAt,r.lang].map(q).join(','))].join('\n')}

function openPanel(){ renderPanel(); $('#rp').hidden=false; }
function closePanel(){ $('#rp').hidden=true; }
function renderPanel(){
  const el=$('#rp'); const R=rows();
  const live=trial&&trial.running?`<div class="live"><b>Running ${trial.task.id} — ${esc(trial.task.en)}</b><span class="note">${trial.taps} taps · ${((performance.now()-trial.start)/1000).toFixed(1)} s</span>
    <div class="fr"><button class="rb x" data-r="abort">End as not completed</button><button class="rb" data-r="close">Back to participant</button></div></div>`:'';
  const last=R[0];
  const lastBox=!live&&last?`<div class="live"><b class="res-${last.result}">${last.task} · ${last.result} · ${(last.durationMs/1000).toFixed(1)} s · ${last.taps} taps (${last.misses} missed)</b><span class="note">${esc(msg)}</span></div>`:'';
  el.innerHTML=`<div class="rp" role="dialog" aria-label="Researcher panel"><header><b>Researcher</b><button class="rb" data-r="close">Close</button></header><div class="body">
   ${live}${lastBox}
   <div><h4>Session</h4><div class="fr"><label>Participant<input id="rpP" value="${esc(PREF.participant)}" autocomplete="off"></label><label>Condition<input id="rpC" value="${esc(PREF.condition)}" autocomplete="off"></label></div>
   <div class="fr" style="margin-top:10px"><button class="rb ${S.lang==='fa'?'a':''}" data-r="lang" data-v="fa">UI فارسی</button><button class="rb ${S.lang==='en'?'a':''}" data-r="lang" data-v="en">UI English</button><button class="rb" data-r="reset">Reset to start state</button></div></div>
   <div><h4>Tasks — reset to start state, show instruction, time from “Start”</h4><div class="tl">${TASKS.map(k=>`<div class="trow"><span class="c">${k.id}<div class="lv">${k.lv}</div></span><span class="d">${esc(k.fa)}</span><button class="rb a" data-r="run" data-v="${k.id}">Run</button></div>`).join('')}</div></div>
   <div><h4>Trials (${R.length}) ${remote?'· shared log':'· this device'}</h4>
    <div class="tbw"><table><thead><tr><th>P</th><th>Task</th><th>Result</th><th>Time s</th><th>Taps</th><th>Miss</th><th>1st tap s</th></tr></thead><tbody>
    ${R.slice(0,60).map(r=>`<tr><td>${esc(r.participant)}</td><td>${r.task}</td><td class="res-${r.result}">${r.result}</td><td>${(r.durationMs/1000).toFixed(1)}</td><td>${r.taps}</td><td>${r.misses}</td><td>${r.firstTapMs==null?'—':(r.firstTapMs/1000).toFixed(1)}</td></tr>`).join('')||'<tr><td colspan="7" class="note">No trials yet. Run a task above.</td></tr>'}
    </tbody></table></div>
    <div class="fr" style="margin-top:10px">${dl?'<button class="rb a" data-r="dl">Save CSV</button>':''}${!dl&&navigator.canShare?'<button class="rb a" data-r="share">Share CSV</button>':''}<button class="rb" data-r="copy">Copy CSV</button></div>
    <div id="csvbox"></div></div>
   <p class="note">Open this panel: press and hold the clock (top corner) for one second, or Shift+R on a keyboard. Taps on the clock are never logged. A trial ends by itself when the goal state is reached, or after ${TIMEOUT/1000} s.</p>
  </div></div>`;
  const pI=$('#rpP'),cI=$('#rpC');
  pI.onchange=()=>{PREF.participant=pI.value.trim();savePref()}; cI.onchange=()=>{PREF.condition=cI.value.trim();savePref()};
}
$('#rp').addEventListener('click',async e=>{
  if(e.target.id==='rp'){closePanel();return}
  const b=e.target.closest('[data-r]'); if(!b)return; const r=b.dataset.r, v=b.dataset.v;
  const pI=$('#rpP'),cI=$('#rpC'); if(pI){PREF.participant=pI.value.trim();PREF.condition=cI.value.trim();savePref()}
  if(r==='close')closePanel();
  if(r==='run')startTask(v);
  if(r==='abort'){await finish('abandoned')}
  if(r==='reset'){S=fresh();render();closePanel()}
  if(r==='lang'){S.lang=PREF.lang=v;savePref();render();renderPanel()}
  if(r==='copy'){const c=csv();try{await navigator.clipboard.writeText(c);b.textContent='Copied'}catch(err){$('#csvbox').innerHTML='<p class="note">Clipboard is blocked here — select the text below and copy it.</p><textarea readonly>'+esc(c)+'</textarea>'}}
  if(r==='share'){try{const f=new File([csv()],`hmi-trials-${new Date().toISOString().slice(0,10)}.csv`,{type:'text/csv'});if(navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'HMI trials'});else throw 0}catch(err){if(!err||err.name!=='AbortError'){$('#csvbox').innerHTML='<p class="note">Sharing is unavailable here — use Copy CSV.</p>'}}}
  if(r==='dl'&&dl){try{await dl.save({filename:`hmi-trials-${new Date().toISOString().slice(0,10)}.csv`,data:csv()})}catch(err){if(err&&err.code!=='declined'){b.textContent='Save unavailable'}}}
});
// long-press clock
let lp;
$('#status').addEventListener('pointerdown',e=>{if(!e.target.closest('#clock'))return;lp=setTimeout(()=>openPanel(),900)});
['pointerup','pointercancel','pointerleave'].forEach(ev=>$('#status').addEventListener(ev,()=>clearTimeout(lp)));
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.shiftKey&&(e.key==='R'||e.key==='r')){$('#rp').hidden?openPanel():closePanel()}});
// keep the live counter fresh while the panel is open mid-trial
setInterval(()=>{if(!$('#rp').hidden&&trial&&trial.running){const n=$('#rp .live .note');if(n)n.textContent=`${trial.taps} taps · ${((performance.now()-trial.start)/1000).toFixed(1)} s`}},500);

/* capabilities: shared trial log + CSV save (absent in a saved copy — page still works) */
(async()=>{
  if(!window.claude||!window.claude.use)return;
  try{db=await window.claude.use('db')}catch(e){db=null}
  if(db){try{db.collection('trials').orderBy('startedAt','desc').limit(1000).onSnapshot(s=>{remote=s.docs.map(d=>({id:d.id,...d.data()}));if(!$('#rp').hidden)renderPanel()},()=>{remote=null})}catch(e){}}
  try{dl=await window.claude.use('downloads')}catch(e){dl=null}
  if(!$('#rp').hidden)renderPanel();
})();

render();
})();
</script>

<script>
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
